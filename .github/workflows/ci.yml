name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Pester + PSScriptAnalyzer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Comprobar que todas las clases cargan
        shell: pwsh
        run: |
          . ./src/Bootstrap.ps1 -Root ./src
          $problemas = [CategoryMap]::AssertComplete()
          if ($problemas.Count -gt 0) {
            $problemas | ForEach-Object { Write-Host "::error::$_" }
            throw "El mapa de bloques de CategoryMap no cubre el catalogo."
          }
          Write-Host "Bootstrap y CategoryMap correctos."

      - name: Comprobar sintaxis de todos los scripts
        shell: pwsh
        run: |
          $errores = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$t, [ref]$e)
            # TypeNotFound es esperado: las clases llegan de archivos hermanos
            # que carga Bootstrap.ps1, no del archivo parseado en aislamiento.
            $reales = @($e | Where-Object { $_.ErrorId -ne 'TypeNotFound' })
            foreach ($err in $reales) {
              $errores++
              Write-Host "::error file=$($_.FullName),line=$($err.Extent.StartLineNumber)::$($err.Message)"
            }
          }
          if ($errores -gt 0) { throw "$errores errores de sintaxis." }
          Write-Host 'Sin errores de sintaxis.'

      - name: Nombres de prueba sin placeholders accidentales
        shell: pwsh
        run: |
          # Pester trata <algo> en el nombre de un Describe, Context o It como
          # placeholder de datos y lo resuelve como variable, de modo que la
          # prueba falla con "la variable '$algo' no se pudo obtener" aunque su
          # cuerpo sea correcto. No hay forma de detectarlo sin ejecutar Pester,
          # asi que se comprueba aqui.
          $malos = @(Select-String -Path './tests/*.ps1' -Pattern "(Describe|Context|It)\s+['`"][^'`"]*<[A-Za-z_]")
          if ($malos.Count -gt 0) {
            foreach ($m in $malos) {
              Write-Host "::error file=$($m.Path),line=$($m.LineNumber)::Nombre de prueba con <placeholder>: $($m.Line.Trim())"
            }
            throw "$($malos.Count) nombres de prueba contienen <angulos>, que Pester interpreta como placeholder."
          }
          Write-Host 'Nombres de prueba correctos.'

      # Pester va antes del analisis estatico a proposito: es la senal que
      # importa, y un tropiezo del linter no debe impedir que los tests corran.
      - name: Pruebas Pester
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Throw = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = './output/pester-results.xml'
          Invoke-Pester -Configuration $cfg

      - name: Analisis estatico
        shell: pwsh
        run: |
          # PSScriptAnalyzer devuelve los diagnosticos TypeNotFound aunque se le
          # pase -Severity Error, porque son errores de parseo y no hallazgos de
          # regla. Aqui son esperados: las clases llegan de archivos hermanos que
          # carga Bootstrap.ps1, no del archivo analizado en aislamiento. Se
          # descartan por nombre de regla; la sintaxis real ya se comprobo arriba.
          $todos = @(Invoke-ScriptAnalyzer -Path . -Recurse -ErrorAction SilentlyContinue)
          $bloqueantes = @($todos | Where-Object {
            $_.RuleName -ne 'TypeNotFound' -and
            $_.Severity.ToString() -in @('Error', 'ParseError')
          })
          if ($bloqueantes.Count -gt 0) {
            $bloqueantes | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String | Write-Host
            foreach ($d in $bloqueantes) {
              Write-Host "::error file=$($d.ScriptPath),line=$($d.Line)::$($d.RuleName): $($d.Message)"
            }
            throw "PSScriptAnalyzer encontro $($bloqueantes.Count) errores."
          }
          Write-Host "Sin errores de analisis estatico ($($todos.Count) diagnosticos revisados, ninguno bloqueante)."

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: output/pester-results.xml
