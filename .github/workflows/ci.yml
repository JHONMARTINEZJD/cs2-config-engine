name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Pester + PSScriptAnalyzer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Comprobar que todas las clases cargan
        shell: pwsh
        run: |
          . ./src/Bootstrap.ps1 -Root ./src
          $problemas = [CategoryMap]::AssertComplete()
          if ($problemas.Count -gt 0) {
            $problemas | ForEach-Object { Write-Host "::error::$_" }
            throw "El mapa de bloques de CategoryMap no cubre el catalogo."
          }
          Write-Host "Bootstrap y CategoryMap correctos."

      - name: Comprobar sintaxis de todos los scripts
        shell: pwsh
        run: |
          $errores = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$t, [ref]$e)
            # TypeNotFound es esperado: las clases llegan de archivos hermanos
            # que carga Bootstrap.ps1, no del archivo parseado en aislamiento.
            $reales = @($e | Where-Object { $_.ErrorId -ne 'TypeNotFound' })
            foreach ($err in $reales) {
              $errores++
              Write-Host "::error file=$($_.FullName),line=$($err.Extent.StartLineNumber)::$($err.Message)"
            }
          }
          if ($errores -gt 0) { throw "$errores errores de sintaxis." }
          Write-Host 'Sin errores de sintaxis.'

      - name: Analisis estatico
        shell: pwsh
        run: |
          # Los archivos de clases no parsean en aislamiento (TypeNotFound), asi
          # que el analizador los descarta y escribe un error de host; eso no es
          # un hallazgo y no debe tumbar el build. La sintaxis ya se comprobo
          # arriba, aqui solo interesan los diagnosticos de reglas.
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error -ErrorAction SilentlyContinue
          if ($r) {
            $r | Format-Table -AutoSize | Out-String | Write-Host
            throw 'PSScriptAnalyzer encontro errores.'
          }
          Write-Host 'Sin errores de analisis estatico.'

      - name: Pruebas Pester
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Throw = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = './output/pester-results.xml'
          Invoke-Pester -Configuration $cfg

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: output/pester-results.xml
